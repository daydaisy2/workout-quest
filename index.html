<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#FBE049">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>세은 운동</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%23FBE049'/%3E%3Crect%20x='18'%20y='18'%20width='64'%20height='64'%20rx='16'%20fill='%23fff'/%3E%3Cpath%20d='M33%2051l11%2011%2024-26'%20fill='none'%20stroke='%232F8F52'%20stroke-width='9'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="세은 운동">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --yellow:#FBE049;
  --yellow-dk:#EED12F;
  --navy:#1E1B7A;
  --ink:#241F3A;
  --ink-2:#6E6A85;
  --ink-3:#9A94AE;
  --cream:#FDF8E7;
  --track:#EFE8CF;
  --done-bg:#DFF2DD;
  --done-ink:#2F7A4B;
  --done:#2F8F52;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  min-height:100dvh;
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  letter-spacing:-.02em;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  background:var(--yellow);
  padding-bottom:calc(34px + env(safe-area-inset-bottom));
}
button,a{font-family:inherit}
.wrap{max-width:600px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 6px}

/* ================= TOP ================= */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 14px}
h1{margin:0;display:flex;align-items:center;gap:8px;font-size:23px;font-weight:900;letter-spacing:-.045em;color:#1B1730}
h1 .ic{font-size:22px;line-height:1}
.reset{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  min-height:42px;padding:0 15px;border-radius:999px;border:0;cursor:pointer;
  font-size:14px;font-weight:900;color:var(--navy);background:#fff;
  box-shadow:0 8px 18px -12px rgba(70,56,0,.7);
  transition:transform .14s ease, box-shadow .2s ease;
  touch-action:manipulation;
}
.reset:active{transform:scale(.95)}
.reset span{font-size:15px;line-height:1}

/* ================= SUMMARY ================= */
.sum{
  background:#fff;border-radius:26px;padding:16px 18px 17px;
  box-shadow:0 14px 28px -22px rgba(80,64,0,.6);
}
.sum-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sum-cnt{display:flex;align-items:baseline;gap:5px;font-size:14px;font-weight:800;color:var(--ink-2)}
.sum-cnt b{font-size:29px;font-weight:900;letter-spacing:-.045em;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.05}
.sum-pct{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--navy);font-variant-numeric:tabular-nums}
.sum.full .sum-pct{color:var(--done)}
.bar{height:13px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:11px}
.bar > i{display:block;height:100%;width:0%;border-radius:999px;background:var(--navy);transition:width .55s cubic-bezier(.22,1,.36,1)}
.sum.full .bar > i{background:var(--done)}
.sum-date{margin:10px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-3)}

/* ================= SECTIONS ================= */
.card{
  background:#fff;border-radius:26px;padding:15px 14px 15px;margin-top:13px;
  box-shadow:0 14px 28px -22px rgba(80,64,0,.55);
}
.c-head{display:flex;align-items:center;gap:9px}
.c-ico{
  flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;line-height:1;background:var(--cream);
}
.c-tit{min-width:0}
.c-name{margin:0;font-size:16.5px;font-weight:900;letter-spacing:-.035em;line-height:1.2;color:var(--ink);word-break:keep-all}
.c-meta{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--ink-3);word-break:keep-all}
.c-cnt{margin-left:auto;flex:none;font-size:14px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.card.full .c-cnt{color:var(--done)}
.c-bar{height:9px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:11px}
.c-bar > i{display:block;height:100%;width:0%;border-radius:999px;background:var(--navy);transition:width .5s cubic-bezier(.22,1,.36,1)}
.card.full .c-bar > i{background:var(--done)}
.rows{margin-top:12px;display:flex;flex-direction:column;gap:8px}

/* ================= ROW ================= */
.row{
  display:flex;align-items:center;gap:9px;
  background:var(--cream);border-radius:16px;padding:7px 8px;
  transition:background .25s ease;
}
.row.done{background:var(--done-bg)}
.thumb{
  flex:none;position:relative;display:block;width:74px;height:43px;border-radius:10px;
  overflow:hidden;background:#E7DFC2;text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(24,20,45,.16)}
.thumb .play::after{
  content:"";width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;
  border-color:transparent transparent transparent #fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
}
.thumb:active{opacity:.82}
.thumb.emoji{display:grid;place-items:center;font-size:22px;line-height:1;background:#F6EFDA}
.hit{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  padding:3px 2px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation;
}
.hit:active{opacity:.65}
.body{flex:1;min-width:0;display:block}
.t{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.025em;color:var(--ink);word-break:keep-all;
}
.s{display:block;margin-top:2px;font-size:12px;font-weight:600;line-height:1.35;color:var(--ink-2);word-break:keep-all}
.row.done .t{color:var(--done-ink);text-decoration:line-through;text-decoration-color:#7FBE97;text-decoration-thickness:2px}
.row.done .s{color:#69A37F}
.chk{
  flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#fff;border:2px solid #DED5B2;transition:background .2s ease, border-color .2s ease;
}
.chk svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s ease}
.row.done .chk{background:var(--done);border-color:var(--done)}
.row.done .chk svg{opacity:1}

/* ================= FOOT ================= */
.foot{margin:18px 10px 4px;text-align:center;font-size:12px;line-height:1.75;font-weight:600;color:rgba(40,34,10,.52);word-break:keep-all}

/* ================= TOAST / MODAL ================= */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:150;
  max-width:88vw;padding:12px 18px;border-radius:999px;
  font-size:14.5px;font-weight:900;color:#fff;text-align:center;
  background:var(--navy);box-shadow:0 16px 30px -14px rgba(30,27,90,.7);
  transition:opacity .22s ease, transform .22s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.top{bottom:auto;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-10px)}
.toast.top.on{transform:translate(-50%,0)}
.modal{
  position:fixed;inset:0;z-index:130;display:grid;place-items:center;padding:24px;
  background:rgba(40,34,10,.42);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.modal[hidden]{display:none}
.modal-card{
  width:100%;max-width:330px;border-radius:26px;padding:24px 20px 20px;text-align:center;
  background:#fff;box-shadow:0 30px 60px -24px rgba(30,20,0,.55);
}
.modal-card .big{font-size:34px;line-height:1;margin-bottom:8px}
.modal-card h3{margin:0;font-size:19px;font-weight:900;letter-spacing:-.04em;color:var(--ink)}
.modal-card p{margin:8px 0 0;font-size:13.5px;font-weight:700;line-height:1.6;color:var(--ink-2);word-break:keep-all}
.mbtn{
  flex:1;min-height:52px;border:0;border-radius:16px;cursor:pointer;
  font-size:16px;font-weight:900;color:#fff;background:var(--navy);
  transition:transform .12s ease;
  -webkit-appearance:none;appearance:none;
}
.mbtn:active{transform:scale(.97)}
.mbtn.ghost{background:var(--cream);color:var(--ink-2)}
.btn-row{display:flex;gap:10px;margin-top:18px}

/* ================= 📝 수정 요청 메모 ================= */
.top-right{display:flex;align-items:center;gap:8px;flex:none}
.memo-btn{
  position:relative;flex:none;width:42px;height:42px;border:0;border-radius:999px;cursor:pointer;
  display:grid;place-items:center;font-size:17px;line-height:1;color:var(--navy);background:#fff;
  box-shadow:0 8px 18px -12px rgba(70,56,0,.7);touch-action:manipulation;
  -webkit-appearance:none;appearance:none;transition:transform .14s ease, background .18s ease, color .18s ease;
}
.memo-btn:active{transform:scale(.95)}
.memo-btn.has{background:var(--navy);color:#fff}
.memo-cnt{
  position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:#E8603C;color:#fff;font-size:9.5px;font-weight:900;line-height:17px;text-align:center;
  border:1.5px solid var(--yellow);font-variant-numeric:tabular-nums;
}
.memo-cnt[hidden]{display:none}
.msheet{position:fixed;inset:0;z-index:130;display:flex;align-items:flex-end;justify-content:center}
.msheet[hidden]{display:none}
.msheet-bd{position:absolute;inset:0;background:rgba(40,34,10,.44);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes msRise{from{transform:translateY(22px);opacity:.7}to{transform:none;opacity:1}}
.msheet-card{
  position:relative;width:100%;max-width:600px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -20px 50px -20px rgba(30,20,0,.5);
  animation:msRise .24s cubic-bezier(.22,1,.36,1);
}
.msheet-h{flex:none;display:flex;align-items:flex-start;gap:10px;padding:18px 18px 6px}
.msheet-h h2{margin:0;font-size:17.5px;font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1.25}
.msheet-x{
  margin-left:auto;flex:none;width:32px;height:32px;border:0;border-radius:50%;background:var(--cream);
  color:#8B856F;font-size:13px;font-weight:900;display:grid;place-items:center;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.msheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 18px 10px;display:flex;flex-direction:column;gap:9px}
#memoInput{
  width:100%;border:2px solid var(--track);border-radius:16px;padding:12px 14px;background:#fff;
  font-family:inherit;font-size:15px;font-weight:700;line-height:1.45;letter-spacing:-.02em;color:var(--ink);
  resize:vertical;min-height:92px;outline:none;transition:border-color .15s;
}
#memoInput:focus{border-color:var(--navy)}
.memo-add{
  width:100%;min-height:48px;border:0;border-radius:16px;cursor:pointer;background:var(--cream);color:var(--navy);
  font-family:inherit;font-size:15px;font-weight:900;letter-spacing:-.02em;-webkit-appearance:none;appearance:none;
}
.memo-add:active{transform:scale(.99)}
.memo-list{display:flex;flex-direction:column;gap:8px}
.memo-row{display:flex;align-items:flex-start;gap:9px;background:var(--cream);border-radius:16px;padding:11px 12px}
.memo-row .mx{flex:1 1 auto;min-width:0;font-size:14px;font-weight:800;line-height:1.45;letter-spacing:-.02em;color:#3A382E;white-space:pre-line;word-break:break-word}
.memo-del{
  flex:none;width:27px;height:27px;border:0;border-radius:9px;background:#FBEAE7;color:#C0392B;
  font-size:12px;font-weight:900;display:grid;place-items:center;cursor:pointer;-webkit-appearance:none;appearance:none;
}
.memo-empty{margin:10px 0;text-align:center;font-size:13px;font-weight:800;color:var(--ink-3);line-height:1.6}
.memo-hint{margin:2px 0 0;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3);line-height:1.5}
.msheet-f{flex:none;display:flex;gap:9px;padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #F4EFDB}
.memo-copy{
  flex:1 1 auto;min-height:52px;border:0;border-radius:16px;cursor:pointer;background:var(--navy);color:#fff;
  font-family:inherit;font-size:16px;font-weight:900;letter-spacing:-.02em;-webkit-appearance:none;appearance:none;
  box-shadow:0 12px 24px -14px rgba(30,27,90,.8);
}
.memo-copy:active{transform:scale(.99)}
.memo-clear{
  flex:none;min-height:52px;padding:0 16px;border:0;border-radius:16px;cursor:pointer;background:var(--cream);color:#6E6A85;
  font-family:inherit;font-size:14px;font-weight:900;letter-spacing:-.02em;-webkit-appearance:none;appearance:none;
}
.memo-clear.confirm{background:#C0392B;color:#fff}

@media (max-width:345px){
  h1{font-size:20px;gap:6px}
  .reset{padding:0 12px;font-size:13px;min-height:40px}
  .thumb{width:66px;height:38px}
  .t{font-size:14.5px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}

/* ================= 입장 잠금 ================= */
body.locked{overflow:hidden}
body.locked .wrap{display:none !important}
#lock{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:var(--yellow);overflow-y:auto}
.lock-card{width:100%;max-width:344px;background:#fff;border-radius:26px;padding:26px 22px 20px;text-align:center;
  box-shadow:0 18px 44px rgba(112,86,0,.20)}
.lock-fl{font-size:40px;line-height:1}
.lock-title{margin:6px 0 0;font-size:26px;font-weight:900;letter-spacing:-.03em;color:var(--navy);line-height:1.1}
.lock-tag{margin:7px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em}
.lock-badge{display:inline-block;margin:14px 0 0;padding:5px 11px;border-radius:999px;background:var(--cream);color:#7C765C;font-size:11.5px;font-weight:800}
.lock-dots{display:flex;justify-content:center;gap:13px;margin:20px 0 2px;height:16px}
.lock-dots i{display:block;width:14px;height:14px;border-radius:50%;background:#EDE7D1;transition:transform .12s,background .12s}
.lock-dots i.on{background:var(--navy);transform:scale(1.06)}
.lock-msg{margin:10px 0 0;min-height:16px;font-size:12px;font-weight:800;color:#C0392B}
.lock-msg.ok{color:var(--done-ink)}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.lock-key{height:52px;border:0;border-radius:17px;background:var(--cream);color:var(--navy);
  font-family:inherit;font-size:21px;font-weight:900;cursor:pointer}
.lock-key:active{background:#F5EED6}
.lock-key.ghost{font-size:13px;font-weight:800;color:var(--ink-2)}
.lock-foot{margin:14px 0 0;font-size:11px;font-weight:700;color:#A9A48D;line-height:1.5}
.lock-card.shake{animation:lockShake .34s}
@keyframes lockShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>
<body class="locked">
<div id="lock" role="dialog" aria-modal="true" aria-label="입장 비밀번호">
  <div class="lock-card" id="lockCard">
    <div class="lock-fl">💪</div>
    <div class="lock-title">세은 운동</div>
    <p class="lock-tag">매일 저녁 팔뚝 운동 체크</p>
    <span class="lock-badge">🔒 나만 보는 운동 기록</span>
    <div class="lock-dots" id="lockDots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="lock-msg" id="lockMsg"></p>
    <div class="lock-pad" id="lockPad">
      <button type="button" class="lock-key" data-k="1">1</button><button type="button" class="lock-key" data-k="2">2</button><button type="button" class="lock-key" data-k="3">3</button>
      <button type="button" class="lock-key" data-k="4">4</button><button type="button" class="lock-key" data-k="5">5</button><button type="button" class="lock-key" data-k="6">6</button>
      <button type="button" class="lock-key" data-k="7">7</button><button type="button" class="lock-key" data-k="8">8</button><button type="button" class="lock-key" data-k="9">9</button>
      <button type="button" class="lock-key ghost" data-k="clear">전체</button><button type="button" class="lock-key" data-k="0">0</button><button type="button" class="lock-key ghost" data-k="del" aria-label="지우기">←</button>
    </div>
    <p class="lock-foot">두 분만 아는 6자리 비밀번호를 입력하면<br>이 기기에서는 다음부터 바로 열려요</p>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <h1><span class="ic" aria-hidden="true">✅</span> 세은 운동</h1>
    <div class="top-right">
      <button class="memo-btn" id="memoBtn" type="button" aria-label="수정 요청 메모">📝<span class="memo-cnt" id="memoCnt" hidden>0</span></button>
      <button class="reset" id="resetBtn" type="button"><span aria-hidden="true">↻</span>오늘 리셋</button>
    </div>
  </header>

  <section class="sum" id="sum">
    <div class="sum-top">
      <span class="sum-cnt"><b id="doneCnt">0</b>/<span id="totalCnt">12</span> 완료</span>
      <span class="sum-pct" id="pctNum">0%</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <p class="sum-date" id="dateLine">오늘의 운동</p>
  </section>

  <main id="sections"></main>

  <p class="foot">
    썸네일을 누르면 유튜브로 바로 이동해요<br>
    운동을 마치면 오른쪽 동그라미를 눌러 체크해 두세요.<br>
    날짜가 바뀌면 새로 시작해요.
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="resetModal" hidden>
  <div class="modal-card">
    <div class="big" aria-hidden="true">↻</div>
    <h3>오늘 기록을 지울까요?</h3>
    <p>체크한 운동이 모두 해제됩니다.</p>
    <div class="btn-row">
      <button class="mbtn ghost" id="cancelReset" type="button">취소</button>
      <button class="mbtn" id="confirmReset" type="button">리셋</button>
    </div>
  </div>
</div>

<div class="msheet" id="memoSheet" hidden>
  <div class="msheet-bd" id="memoBackdrop"></div>
  <div class="msheet-card" role="dialog" aria-modal="true" aria-labelledby="memoTitle">
    <div class="msheet-h">
      <h2 id="memoTitle">📝 두두에게 보낼 수정 요청</h2>
      <button class="msheet-x" id="memoClose" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="msheet-b">
      <textarea id="memoInput" rows="3" maxlength="300" placeholder="예: 2세트 영상 순서를 바꿔 주세요"></textarea>

  var ALL = [];

  var els = {};
  var toastTimer = null, memoryStore = null;

  /* ================= 유틸 ================= */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayKey() { return fmtKey(new Date()); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function readRaw() {
    try { return window.localStorage.getItem(STORAGE_KEY); }
    catch (e) { return memoryStore; }
  }
  function writeRaw(v) {
    try { window.localStorage.setItem(STORAGE_KEY, v); }
    catch (e) { memoryStore = v; }
  }

  /* ================= 저장 ================= */
  function save() { writeRaw(JSON.stringify(state)); }

  function load() {
    state = { date: todayKey(), checks: {}, history: [], celebrated: '' };
    var raw = readRaw();
    if (!raw) return;
    var d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || typeof d !== 'object') return;
    if (typeof d.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.date)) state.date = d.date;
    if (d.checks && typeof d.checks === 'object' && !(d.checks instanceof Array)) {
      var c = {};
      Object.keys(d.checks).forEach(function (k) { if (VALID[k] && d.checks[k]) c[k] = 1; });
      state.checks = c;
    }
    if (Object.prototype.toString.call(d.history) === '[object Array]') {
      state.history = d.history.filter(function (h) {
        return h && /^\d{4}-\d{2}-\d{2}$/.test(String(h.date || ''));
      }).map(function (h) {
        return {
          date: String(h.date),
          pct: Math.max(0, Math.min(100, Math.round(Number(h.pct) || 0))),
          done: Math.max(0, parseInt(h.done, 10) || 0)
        };
      }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(-7);
    }
    if (typeof d.celebrated === 'string') state.celebrated = d.celebrated;
  }

  /* ================= 계산 ================= */
  function computeStats() {
    var done = 0;
    ALL.forEach(function (it) { if (state.checks[it.id]) done++; });
    var pct = Math.round((done / TOTAL_COUNT) * 100);
    if (pct > 100) pct = 100;
    return { done: done, pct: pct };
  }

  /* ================= 마크업 ================= */
  function rowHTML(it) {

    if (it.img) {
      media = '<a class="thumb" href="' + it.url + '" target="_blank" rel="noopener noreferrer"'

        + (THUMBS[it.img] ? '<img src="' + THUMBS[it.img] + '" alt="" decoding="async">' : '')
        + '<span class="play" aria-hidden="true"></span>'
        + '</a>';
    } else {
      media = '<span class="thumb emoji" aria-hidden="true">' + (it.ico || '💆') + '</span>';

    return '<div class="row" data-id="' + it.id + '">'

      + '<button class="hit" type="button" data-id="' + it.id + '" aria-pressed="false">'
      + '<span class="body"><span class="t">' + esc(it.title) + '</span>'
      + '<span class="s">' + esc(it.sub) + '</span></span>'
      + '<span class="chk" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.8 12.7l4.7 4.7L19.4 6.5"/></svg></span>'
      + '</button>'
      + '</div>';
  }

  function render() {
    els.sections.innerHTML = GROUPS.map(function (g) {
      return '<section class="card" data-group="' + g.id + '">'
        + '<div class="c-head">'
        + '<span class="c-ico" aria-hidden="true">' + g.emoji + '</span>'
        + '<div class="c-tit"><h2 class="c-name">' + esc(g.name) + '</h2>'
        + '<span class="c-meta">' + esc(g.meta) + '</span></div>'
        + '<span class="c-cnt" data-count="' + g.id + '">0/' + g.items.length + '</span>'
        + '</div>'
        + '<div class="c-bar"><i data-bar="' + g.id + '"></i></div>'
        + '<div class="rows">' + g.items.map(rowHTML).join('') + '</div>'
        + '</section>';
    }).join('');

  /* ================= 동기화 ================= */
  function syncRows() {
    var nodes = document.querySelectorAll('.row');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var on = !!state.checks[el.getAttribute('data-id')];
      if (on) el.classList.add('done'); else el.classList.remove('done');
      var btn = el.querySelector('.hit');
      if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

      var done = 0;
      g.items.forEach(function (it) { if (state.checks[it.id]) done++; });
      var cnt = document.querySelector('[data-count="' + g.id + '"]');
      if (cnt) cnt.textContent = done + '/' + g.items.length;
      var bar = document.querySelector('[data-bar="' + g.id + '"]');
      if (bar) bar.style.width = Math.round((done / g.items.length) * 100) + '%';
      var card = document.querySelector('[data-group="' + g.id + '"]');
      if (card) card.classList.toggle('full', done === g.items.length);
    });
  }

  function syncSummary() {
    var st = computeStats();
    els.doneCnt.textContent = String(st.done);
    els.totalCnt.textContent = String(TOTAL_COUNT);
    els.pctNum.textContent = st.pct + '%';
    els.barFill.style.width = st.pct + '%';
    els.sum.classList.toggle('full', st.done === TOTAL_COUNT);

    if (st.done < TOTAL_COUNT && state.celebrated === state.date) { state.celebrated = ''; save(); }
    if (st.done === TOTAL_COUNT && state.celebrated !== state.date) {
      state.celebrated = state.date;
      save();
      toast('오늘 운동 ' + TOTAL_COUNT + '개 모두 완료! 💛');
    }
    return st;
  }

  function syncAll() { syncRows(); syncSections(); return syncSummary(); }

  /* ================= 액션 ================= */
  function toggleQuest(id) {
    var on = !state.checks[id];
    if (on) state.checks[id] = 1; else delete state.checks[id];
    save();
    syncAll();
    if (on) {
      if (navigator.vibrate) navigator.vibrate(14);
      var st = computeStats();
      if (st.done < TOTAL_COUNT) toast('✓ 완료했어요');
    } else {
      if (navigator.vibrate) navigator.vibrate([8, 26, 8]);
      toast('체크를 해제했어요');
    }
  }

  function doReset() {
    closeReset();
    state.checks = {};
    state.celebrated = '';
    save();
    syncAll();
    toast('오늘 기록을 지웠어요');
  }

  /* ================= 안드로이드 뒤로가기 — 열린 팝업만 닫기 =================
     리셋 확인 팝업·수정 요청 메모를 열 때 히스토리를 하나 쌓고, 뒤로가기(popstate)에서는
     앱을 나가지 않고 열려 있는 팝업만 닫는다. */
  var navHistPushed = false, navSelfBack = false;
  function anyPopupOpen() { return !els.resetModal.hidden || !els.memoSheet.hidden; }
  function pushPopupHistory() {
    if (navHistPushed) return;
    try { history.pushState({ appModal: true }, ''); navHistPushed = true; } catch (e) {}
  }
  function settlePopupHistory() {
    if (!navHistPushed) return;
    setTimeout(function () {
      if (!navHistPushed) return;                       /* 이미 정리됐거나 뒤로가기로 소비됨 */
      if (anyPopupOpen()) return;                       /* 다른 팝업이 이어받았다 */
      navHistPushed = false;
      if (history.state && history.state.appModal) {
        navSelfBack = true;
        try { history.back(); } catch (e) { navSelfBack = false; }
      }
    }, 0);
  }
  function openReset() {
    els.resetModal.hidden = false;
    pushPopupHistory();
  }
  function closeReset() {
    els.resetModal.hidden = true;
    settlePopupHistory();
  }

  /* ================= 📝 수정 요청 메모 (이 기기에만 저장) =================
     고치고 싶은 곳을 그때그때 적어 두고, [전체 복사]로 피클 채팅에 붙여넣을 수 있게 한다. */
  var MEMO_KEY = 'seeuni.workout-quest.memos.v1';
  var MEMOS = loadMemos();
  var memoTimer = null;
  function loadMemos() {
    try {
      var a = JSON.parse(window.localStorage.getItem(MEMO_KEY) || '[]');
      return Object.prototype.toString.call(a) === '[object Array]'
        ? a.filter(function (m) { return m && m.text; }) : [];
    } catch (e) { return []; }
  }
  function saveMemos() {
    try { window.localStorage.setItem(MEMO_KEY, JSON.stringify(MEMOS)); } catch (e) {}
    paintMemoBadge();
  }
  function paintMemoBadge() {
    var n = MEMOS.length;
    els.memoBtn.classList.toggle('has', n > 0);
    els.memoCnt.textContent = n > 9 ? '9+' : String(n);
    els.memoCnt.hidden = n === 0;
    els.memoBtn.setAttribute('aria-label', n ? '수정 요청 메모 ' + n + '개' : '수정 요청 메모');
  }
  function memoRowsHtml() {
    if (!MEMOS.length) return '<p class="memo-empty">아직 적어 둔 요청이 없어요<br>고치고 싶은 곳을 그때그때 적어 두세요</p>';
    return MEMOS.map(function (m) {
      return '<div class="memo-row"><span class="mx">' + esc(m.text) + '</span>'
        + '<button class="memo-del" type="button" data-mdel="' + esc(m.id) + '" aria-label="삭제">✕</button></div>';
    }).join('');
  }
  function paintMemoList() { els.memoList.innerHTML = memoRowsHtml(); }
  function resetMemoClear() {
    els.memoClear.classList.remove('confirm');
    els.memoClear.textContent = '🗑 비우기';
    if (memoTimer) { window.clearTimeout(memoTimer); memoTimer = null; }
  }
  function addMemo() {
    var v = els.memoInput.value.trim();
    if (!v) { toast('요청 내용을 적어 주세요'); els.memoInput.focus(); return; }
    MEMOS.push({ id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text: v, at: Date.now() });
    saveMemos();
    els.memoInput.value = '';
    paintMemoList();
    toast('메모를 추가했어요');
    els.memoInput.focus();
  }
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, t.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      if (ok) resolve(); else reject(new Error('copy failed'));
    });
  }
  function openMemo() {
    els.memoInput.value = '';
    resetMemoClear();
    paintMemoList();
    els.memoSheet.hidden = false;
    els.toast.classList.add('top');   /* 시트가 열려 있으면 알림은 위로 (아래 버튼을 가리지 않게) */
    pushPopupHistory();
  }
  function closeMemo() {
    els.memoSheet.hidden = true;
    els.toast.classList.remove('top');
    settlePopupHistory();
    els.memoInput.blur();
    resetMemoClear();
  }
  function closeTopPopup() {
    if (!els.memoSheet.hidden) closeMemo();
    else if (!els.resetModal.hidden) closeReset();
  }

  /* ================= 날짜 넘김 ================= */
  function pushHistory(entry) {
    state.history = state.history.filter(function (h) { return h.date !== entry.date; });
    state.history.push(entry);
    state.history.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (state.history.length > 7) state.history = state.history.slice(-7);
  }
  function rolloverIfNeeded() {
    var key = todayKey();
    if (state.date === key) return false;
    var st = computeStats();
    if (state.date) pushHistory({ date: state.date, pct: st.pct, done: st.done });
    state.date = key;
    state.checks = {};
    state.celebrated = '';
    save();
    return true;
  }

  /* ================= 연출 ================= */
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('on');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { els.toast.classList.remove('on'); }, 1900);
  }

  /* ================= 이벤트 ================= */
  function bind() {
    document.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.hit') : null;
      if (!btn) return;
      toggleQuest(btn.getAttribute('data-id'));
    });

    els.resetBtn.addEventListener('click', openReset);
    els.cancelReset.addEventListener('click', closeReset);
    els.confirmReset.addEventListener('click', doReset);
    els.resetModal.addEventListener('click', function (e) { if (e.target === els.resetModal) closeReset(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!els.memoSheet.hidden) closeMemo(); else closeReset(); } });
    window.addEventListener('popstate', function () {
      if (navSelfBack) { navSelfBack = false; return; }   /* 정리용 back() — 무시 */
      if (!anyPopupOpen()) return;
      navHistPushed = false;   /* 엔트리는 방금 소비됐다 */
      closeTopPopup();         /* flag가 false라 settlePopupHistory는 히스토리를 건드리지 않는다 */
    });

    /* 📝 수정 요청 메모 */
    els.memoBtn.addEventListener('click', openMemo);
    els.memoClose.addEventListener('click', closeMemo);
    els.memoBackdrop.addEventListener('click', closeMemo);
    els.memoAdd.addEventListener('click', addMemo);
    els.memoInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addMemo(); }
    });
    els.memoList.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-mdel]') : null;
      if (!b) return;
      MEMOS = MEMOS.filter(function (m) { return m.id !== b.getAttribute('data-mdel'); });
      saveMemos();
      paintMemoList();
    });
    els.memoCopy.addEventListener('click', function () {
      if (!MEMOS.length) { toast('복사할 메모가 없어요'); return; }
      var text = '세은 운동 수정 요청:\n' + MEMOS.map(function (m) { return '- ' + m.text; }).join('\n');
      try {
        copyText(text).then(function () { toast('복사했어요! 피클 채팅에 붙여넣기 해 주세요'); },
          function () { toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요'); });
      } catch (err) { toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요'); }
    });
    els.memoClear.addEventListener('click', function () {
      if (!MEMOS.length) { toast('비울 메모가 없어요'); return; }
      if (!els.memoClear.classList.contains('confirm')) {
        els.memoClear.classList.add('confirm');
        els.memoClear.textContent = '정말 비울까요?';
        if (memoTimer) window.clearTimeout(memoTimer);
        memoTimer = window.setTimeout(resetMemoClear, 4000);
        return;
      }
      MEMOS = [];
      saveMemos();
      paintMemoList();
      resetMemoClear();
      toast('메모를 모두 지웠어요');
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  }

  function tick() {
    if (rolloverIfNeeded()) {
      syncAll();
      toast('날짜가 바뀌어 오늘 운동이 새로 시작됐어요');
      return;
    }
    syncAll();
  }

  /* ================= 시작 ================= */
  function init() {
    els.sum = document.getElementById('sum');
    els.doneCnt = document.getElementById('doneCnt');
    els.totalCnt = document.getElementById('totalCnt');
    els.pctNum = document.getElementById('pctNum');
    els.barFill = document.getElementById('barFill');
    els.dateLine = document.getElementById('dateLine');
    els.sections = document.getElementById('sections');
    els.toast = document.getElementById('toast');
    els.resetBtn = document.getElementById('resetBtn');
    els.resetModal = document.getElementById('resetModal');
    els.cancelReset = document.getElementById('cancelReset');
    els.confirmReset = document.getElementById('confirmReset');
    els.memoBtn = document.getElementById('memoBtn');
    els.memoCnt = document.getElementById('memoCnt');
    els.memoSheet = document.getElementById('memoSheet');
    els.memoBackdrop = document.getElementById('memoBackdrop');
    els.memoClose = document.getElementById('memoClose');
    els.memoInput = document.getElementById('memoInput');
    els.memoAdd = document.getElementById('memoAdd');
    els.memoList = document.getElementById('memoList');
    els.memoCopy = document.getElementById('memoCopy');
    els.memoClear = document.getElementById('memoClear');
    paintMemoBadge();

    load();
    var rolled = rolloverIfNeeded();
    var d = new Date();
    els.dateLine.textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEKDAYS[d.getDay()] + '요일 · 운동 ' + TOTAL_COUNT + '개';
    render();
    syncAll();
    bind();
    if (rolled) toast('새 날이 시작됐어요. 오늘 운동부터!');
    window.setInterval(tick, 30000);
  }

  /* ================= 입장 잠금 =================
     비밀번호는 코드에 적지 않는다. SHA-256 해시로만 비교하고,
     한 번 통과한 기기는 localStorage 에 표시만 남겨 다음부터 바로 열린다.
     잠금을 통과하기 전에는 운동 목록을 그리지 않는다(화면·기록 모두 가림). */
  var LOCK_KEY = 'seeuni.lock.v1';
  var LOCK_SALT = 'workout::v1::';
  var LOCK_HASH = '6ff43d58645ececf63578b66b5a6e95fc634ee6c6dfeebe2550e6dfea3612646';
  var lockBuf = '', lockBusy = false;

  function lockPaint() {
    var dots = document.querySelectorAll('#lockDots i');
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i < lockBuf.length);
  }
  function lockMsg(text, ok) {
    var m = document.getElementById('lockMsg');
    if (!m) return;
    m.className = 'lock-msg' + (ok ? ' ok' : '');
    m.textContent = text || '';
  }
  function sha256Hex(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    });
  }
  function lockPassed() {
    try {
      var v = JSON.parse(window.localStorage.getItem(LOCK_KEY) || 'null');
      return !!(v && v.h === LOCK_HASH);
    } catch (e) { return false; }
  }
  function lockRemove() {
    var el = document.getElementById('lock');
    if (el && el.parentNode) el.parentNode.removeChild(el);
    document.body.classList.remove('locked');
  }
  function lockTry() {
    if (lockBusy || lockBuf.length !== 6) return;
    lockBusy = true;
    lockMsg('확인 중…');
    if (!(window.crypto && crypto.subtle)) {
      lockMsg('보안 연결(https)에서 열어 주세요');
      lockBusy = false; return;
    }
    sha256Hex(LOCK_SALT + lockBuf).then(function (h) {
      if (h !== LOCK_HASH) {
        lockMsg('비밀번호가 맞지 않아요');
        var c = document.getElementById('lockCard');
        if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
        lockBuf = ''; lockPaint();
        lockBusy = false; return;
      }
      try { window.localStorage.setItem(LOCK_KEY, JSON.stringify({ h: LOCK_HASH, at: Date.now() })); } catch (e) {}
      lockMsg('열리는 중…', true);
      lockBusy = false;
      lockRemove();
      init();
    }).catch(function () {
      lockMsg('잠시 후 다시 시도해 주세요');
      lockBusy = false;
    });
  }
  function lockKey(k) {
    lockMsg('');
    if (k === 'del') { lockBuf = lockBuf.slice(0, -1); lockPaint(); return; }
    if (k === 'clear') { lockBuf = ''; lockPaint(); return; }
    if (lockBuf.length >= 6) return;
    lockBuf += k; lockPaint();
    if (lockBuf.length === 6) window.setTimeout(lockTry, 110);
  }
  function initLock() {
    lockBuf = ''; lockPaint(); lockMsg('');
    var pad = document.getElementById('lockPad');
    if (pad) pad.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-k]') : null;
      if (b) lockKey(b.getAttribute('data-k'));
    });
    document.addEventListener('keydown', function (e) {
      if (!document.getElementById('lock')) return;
      if (/^\d$/.test(e.key)) lockKey(e.key);
      else if (e.key === 'Backspace') lockKey('del');
      else if (e.key === 'Enter' && lockBuf.length === 6) lockTry();
    });
  }

  /* 시작: 이미 통과한 기기면 바로, 아니면 잠글 화면부터 */
  function start() {
    if (lockPassed()) { lockRemove(); init(); return; }
    initLock();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
})();
</script>
